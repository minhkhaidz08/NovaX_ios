name: NovaX
options:
  bundleIdPrefix: com.novax
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.2"
settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_ON_DEMAND_RESOURCES: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: ""
  configs:
    Release:
      COPY_PHASE_STRIP: YES
      STRIP_STYLE: all
      STRIP_INSTALLED_PRODUCT: YES
      SEPARATE_STRIP: YES
      DEBUG_INFORMATION_FORMAT: dwarf
      SWIFT_COMPILER_CODE_COVERAGE_GENERATE_DEBUG_INFO: NO
targets:
  NovaX:
    type: application
    platform: iOS
    sources:
      - path: Sources/NovaX
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.novax.ios
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Sources/NovaX/Info.plist
      properties:
        CFBundleName: "NovaX"
        CFBundleDisplayName: "NovaX"
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0.0"
        CFBundlePackageType: APPL
        LSRequiresIPhoneOS: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        CADisableMinimumFrameDurationOnPhone: true
        LSApplicationQueriesSchemes:
          - freefire
          - freefiremax
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleIconFiles:
              - nova_logo_1024
